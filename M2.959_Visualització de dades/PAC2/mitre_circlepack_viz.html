        const svgWidth = 1200;
        const svgHeight = 1200;
        const margin = 220; // Canvas padding reserved for leader lines & outer text
        
        const innerWidth = svgWidth - (margin * 2);
        const innerHeight = svgHeight - (margin * 2);
        const centerX = svgWidth / 2;
        const centerY = svgHeight / 2;

        const pack = data => d3.pack()
            .size([innerWidth, innerHeight])
            .padding(8)
            (d3.hierarchy(data)
                .sum(d => d.value)
                .sort((a, b) => b.value - a.value));

        const root = pack(data);

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight);

        const chartGroup = svg.append("g")
            .attr("transform", `translate(${margin}, ${margin})`);

        const tooltip = d3.select("#tooltip");

        // Render Nodes
        const node = chartGroup.selectAll("g")
            .data(root.descendants())
            .join("g")
            .attr("transform", d => `translate(${d.x},${d.y})`);

        node.append("circle")
            .attr("class", d => d.depth === 2 ? "leaf" : "parent")
            .attr("r", d => d.r)
            .attr("fill", d => {
                if (d.depth === 0) return "#0b0e14";
                if (d.depth === 1) return "#161b22";
                return d.data.color;
            })
            .attr("stroke", d => d.depth === 1 ? "#30363d" : "#0b0e14")
            .attr("stroke-width", d => d.depth === 1 ? 1.5 : 1)
            .attr("fill-opacity", d => d.depth === 1 ? 0.4 : 0.9)
            .on("mouseover", (event, d) => {
                if (d.depth === 0) return;
                tooltip.style("visibility", "visible");
                if (d.depth === 1) {
                    tooltip.html(`
                        <strong style="color: #58a6ff;">Tactic:</strong> ${d.data.name}<br/>
                        <strong>Total Techniques:</strong> ${d.children ? d.children.length : 0}
                    `);
                } else {
                    tooltip.html(`
                        <strong style="color: #58a6ff;">Technique:</strong> ${d.data.name}<br/>
                        <strong>Sub-techniques:</strong> ${d.data.subtechnique_count}<br/>
                        <strong>Platforms:</strong> ${d.data.platforms}
                    `);
                }
            })
            .on("mousemove", (event) => {
                tooltip.style("top", (event.pageY - 10) + "px")
                       .style("left", (event.pageX + 15) + "px");
            })
            .on("mouseout", () => tooltip.style("visibility", "hidden"));

        // Inner technique IDs (Depth 2)
        node.filter(d => d.depth === 2 && d.r > 11)
            .append("text")
            .attr("class", "node-label")
            .attr("dy", "0.3em")
            .text(d => d.data.name.split(":")[0])
            .style("font-size", d => Math.min(d.r / 1.8, 10) + "px");

        // ---------------------------------------------------------
        // EXTERNAL LEADER LINES & OUTSIDE TACTIC LABELS
        // ---------------------------------------------------------
        const tactics = root.children;
        const leaderGroup = svg.append("g").attr("class", "leader-lines-group");

        tactics.forEach(t => {
            // Calculate center points in overall SVG coordinates
            const circleCenterX = t.x + margin;
            const circleCenterY = t.y + margin;

            // Angle from visualization center to tactic circle
            const angle = Math.atan2(circleCenterY - centerY, circleCenterX - centerX);

            // Anchor point on tactic circle border
            const startX = circleCenterX + Math.cos(angle) * t.r;
            const startY = circleCenterY + Math.sin(angle) * t.r;

            // External label coordinates
            const labelDistance = 120;
            const endX = circleCenterX + Math.cos(angle) * (t.r + labelDistance);
            const endY = circleCenterY + Math.sin(angle) * (t.r + labelDistance);

            // Draw anchor dot on circle edge
            leaderGroup.append("circle")
                .attr("cx", startX)
                .attr("cy", startY)
                .attr("r", 3)
                .attr("class", "tactic-anchor-point");

            // Curved Leader Line
            const controlX = (startX + endX) / 2;
            const controlY = (startY + endY) / 2;
            const pathData = `M ${startX},${startY} Q ${controlX},${controlY} ${endX},${endY}`;

            leaderGroup.append("path")
                .attr("d", pathData)
                .attr("class", "tactic-line");

            // Align text anchor depending on quadrant (Left or Right)
            const isRightSide = endX >= centerX;
            const textAnchor = isRightSide ? "start" : "end";
            const textOffsetX = isRightSide ? 8 : -8;

            leaderGroup.append("text")
                .attr("x", endX + textOffsetX)
                .attr("y", endY + 4)
                .attr("class", "tactic-header-outer")
                .attr("text-anchor", textAnchor)
                .text(t.data.name);
        });

    </script>
