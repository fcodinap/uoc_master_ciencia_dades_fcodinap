        // Dimensions i Marges
        const margin = {top: 40, right: 180, bottom: 60, left: 80};
        const width = 850 - margin.left - margin.right;
        const height = 550 - margin.top - margin.bottom;

        // SVG
        const svg = d3.select("#d3-chart-container")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        // Escales Logarítmiques (Eix X invertit: Progressió cap a la dreta)
        const xScale = d3.scaleLog()
            .domain([d3.max(data, d => d.node_nm) * 1.2, d3.min(data, d => d.node_nm) / 1.2])
            .range([width, 0]);

        const yScale = d3.scaleLog()
            .domain([d3.min(data, d => d.transistor_count_m) / 1.5, d3.max(data, d => d.transistor_count_m) * 1.5])
            .range([height, 0]);

        // Colors
        const colorBrand = d3.scaleOrdinal(d3.schemeSet1);
        const colorDecade = d3.scaleOrdinal(d3.schemeSet2);

        // Eix X
        svg.append("g")
            .attr("transform", "translate(0," + height + ")")
            .call(d3.axisBottom(xScale).ticks(5, ".0f"))
            .append("text")
            .attr("x", width / 2)
            .attr("y", 40)
            .attr("fill", "black")
            .style("text-anchor", "middle")
            .text("Process Node (nm) [Log Scale — Inverted: Progress →]");

        // Eix Y
        svg.append("g")
            .call(d3.axisLeft(yScale).ticks(5, "~s"))
            .append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", -50)
            .attr("x", -height / 2)
            .attr("fill", "black")
            .style("text-anchor", "middle")
            .text("Transistor Count (Millions) [Log Scale]");

        // Convex Hulls per Dècada
        const decades = Array.from(new Set(data.map(d => d.decade_label)));

        decades.forEach(decade => {
            const groupData = data.filter(d => d.decade_label === decade);
            if (groupData.length >= 3) {
                const points = groupData.map(d => [xScale(d.node_nm), yScale(d.transistor_count_m)]);
                const hull = d3.polygonHull(points);

                if (hull) {
                    svg.append("path")
                        .datum(hull)
                        .attr("class", "hull")
                        .attr("d", d => "M" + d.join("L") + "Z")
                        .attr("fill", colorDecade(decade))
                        .attr("stroke", colorDecade(decade));
                }
            }
        });

        // Scatter Plot
        const tooltip = d3.select("#d3-tooltip");

        svg.selectAll(".dot")
            .data(data)
            .enter()
            .append("circle")
            .attr("class", "dot")
            .attr("cx", d => xScale(d.node_nm))
            .attr("cy", d => yScale(d.transistor_count_m))
            .attr("r", 5)
            .attr("fill", d => colorBrand(d.brand))
            .on("mouseover", (event, d) => {
                tooltip.style("display", "block")
                    .html("<strong>GPU Spec</strong><br>Brand: " + d.brand + "<br>Decade: " + d.decade_label + "<br>Node: " + d.node_nm + " nm<br>Transistors: " + d.transistor_count_m + "M")
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 20) + "px");
            })
            .on("mouseout", () => {
                tooltip.style("display", "none");
            });

        // Llegenda
        const brands = Array.from(new Set(data.map(d => d.brand)));
        let legendY = 20;
        
        brands.forEach((brand, i) => {
            svg.append("circle").attr("cx", width + 20).attr("cy", legendY + (i * 18)).attr("r", 4).attr("fill", colorBrand(brand));
            svg.append("text").attr("x", width + 30).attr("y", legendY + (i * 18) + 4).text(brand).attr("class", "legend-text");
        });

        legendY += brands.length * 18 + 15;
        decades.forEach((decade, i) => {
            svg.append("rect").attr("x", width + 15).attr("y", legendY + (i * 18) - 4).attr("width", 8).attr("height", 8).attr("fill", colorDecade(decade)).attr("opacity", 0.5);
            svg.append("text").attr("x", width + 28).attr("y", legendY + (i * 18) + 4).text(decade).attr("class", "legend-text");
        });
    </script>
